<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgSUS - Sistema de Propostas de Vagas</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;700&display=swap" rel="stylesheet">
    <!-- Scripts React -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel para traduzir JSX no navegador -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0a0e1a;
            font-family: 'Ubuntu', sans-serif;
            color: #e2e8f0;
        }
        /* Estilos base para garantir consistência sem CSS externo */
        * { box-sizing: border-box; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(255,255,255,0.02); }
        ::-webkit-scrollbar-thumb { background: rgba(99,102,241,0.3); border-radius: 4px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // ── DADOS E CONSTANTES ──────────────────────────────────────────────────
        const CARGO_DATA = {
            "ANALISTA DE GESTAO": { salario: 9626, alimentacao: 1700, bemEstar: 1600, insalubridade: 0, periculosidade: 0 },
            "ANALISTA DE GESTÃO": { salario: 8000, alimentacao: 1600, bemEstar: 1600, insalubridade: 0, periculosidade: 0 },
            "ANALISTA GESTÃO": { salario: 8800, alimentacao: 1700, bemEstar: 1600, insalubridade: 0, periculosidade: 0 },
            "ANALISTA TECNICO": { salario: 8000, alimentacao: 840, bemEstar: 0, insalubridade: 0, periculosidade: 0 },
            "ANALISTA ADMINISTRATIVO": { salario: 5400, alimentacao: 840, bemEstar: 0, insalubridade: 0, periculosidade: 0 },
            "ASSESSOR DA PRESIDENCIA": { salario: 14800, alimentacao: 1700, bemEstar: 1600, insalubridade: 0, periculosidade: 0 },
            "ASSESSOR DE DIRETORIA": { salario: 12800, alimentacao: 1700, bemEstar: 1600, insalubridade: 0, periculosidade: 0 },
            "ASSESSOR DE INSTANCIA": { salario: 12800, alimentacao: 1700, bemEstar: 1600, insalubridade: 0, periculosidade: 0 },
            "ASSESSOR DE UNIDADE": { salario: 11800, alimentacao: 1700, bemEstar: 1600, insalubridade: 0, periculosidade: 0 },
            "ASSESSOR UNIDADE": { salario: 11800, alimentacao: 1700, bemEstar: 1600, insalubridade: 0, periculosidade: 0 },
            "ASSESSOR ESPECIALISTA": { salario: 17700, alimentacao: 840, bemEstar: 0, insalubridade: 0, periculosidade: 0 },
            "ASSESSOR SI": { salario: 11000, alimentacao: 840, bemEstar: 0, insalubridade: 0, periculosidade: 0 },
            "AUXILIAR DE GESTAO": { salario: 4000, alimentacao: 1700, bemEstar: 1600, insalubridade: 0, periculosidade: 0 },
            "AUXILIAR DE GESTÃO": { salario: 3000, alimentacao: 1600, bemEstar: 1600, insalubridade: 0, periculosidade: 0 },
            "CHEFE DE GABINETE": { salario: 18869, alimentacao: 1700, bemEstar: 1600, insalubridade: 0, periculosidade: 0 },
            "COORDENADOR": { salario: 14800, alimentacao: 1700, bemEstar: 1600, insalubridade: 0, periculosidade: 0 },
            "COORDENADOR DE PROJETO": { salario: 14800, alimentacao: 1600, bemEstar: 1600, insalubridade: 0, periculosidade: 0 },
            "COORDENADOR DE REGIONAL": { salario: 14800, alimentacao: 1600, bemEstar: 1600, insalubridade: 0, periculosidade: 0 },
            "COORDENADOR INTERFEDERATIVO": { salario: 14800, alimentacao: 1600, bemEstar: 1600, insalubridade: 0, periculosidade: 0 },
            "DIRETOR": { salario: 33546, alimentacao: 1700, bemEstar: 1600, insalubridade: 0, periculosidade: 0 },
            "DIRETOR PRESIDENTE": { salario: 36690, alimentacao: 1700, bemEstar: 1600, insalubridade: 0, periculosidade: 0 },
            "GESTOR EXECUTIVO": { salario: 23063, alimentacao: 1700, bemEstar: 1600, insalubridade: 0, periculosidade: 0 },
            "GESTOR DE PROJETOS": { salario: 18869, alimentacao: 1700, bemEstar: 1600, insalubridade: 0, periculosidade: 0 },
            "ASSISTENTE DE PROJETO": { salario: 8800, alimentacao: 1700, bemEstar: 1600, insalubridade: 0, periculosidade: 0 },
            "ASSISTENTE DE UNIDADE": { salario: 11800, alimentacao: 1700, bemEstar: 1600, insalubridade: 0, periculosidade: 0 },
            "PSICOLOGO AGENCIA": { salario: 8800, alimentacao: 1700, bemEstar: 1600, insalubridade: 0, periculosidade: 0 },
            "AGENTE DE PROJETO": { salario: 4000, alimentacao: 1700, bemEstar: 1600, insalubridade: 0, periculosidade: 0 },
            "APRENDIZ": { salario: 1000, alimentacao: 1700, bemEstar: 1600, insalubridade: 0, periculosidade: 0 },
            "ENGENHEIRO DE SEGURANCA DO TRABALHO": { salario: 6439, alimentacao: 1700, bemEstar: 1600, insalubridade: 0, periculosidade: 0 },
            "ADVOGADO": { salario: 10800, alimentacao: 840, bemEstar: 0, insalubridade: 0, periculosidade: 0 },
            "CONTADOR": { salario: 7060, alimentacao: 840, bemEstar: 0, insalubridade: 0, periculosidade: 0 },
            "ADMINISTRADOR": { salario: 7060, alimentacao: 840, bemEstar: 0, insalubridade: 0, periculosidade: 0 },
            "ASSISTENTE ADMINISTRATIVO": { salario: 4800, alimentacao: 800, bemEstar: 0, insalubridade: 0, periculosidade: 0 },
            "AUXILIAR ADMINISTRATIVO": { salario: 2900, alimentacao: 950, bemEstar: 0, insalubridade: 162, periculosidade: 0 },
            "ASSESSOR DE IMPRENSA": { salario: 5000, alimentacao: 840, bemEstar: 0, insalubridade: 0, periculosidade: 0 },
            "PEDAGOGO": { salario: 7060, alimentacao: 800, bemEstar: 0, insalubridade: 0, periculosidade: 0 },
            "ENFERMEIRO": { salario: 7446, alimentacao: 1075, bemEstar: 400, insalubridade: 324, periculosidade: 0 },
            "MEDICO": { salario: 15080, alimentacao: 1200, bemEstar: 800, insalubridade: 324, periculosidade: 0 },
            "PSICOLOGO": { salario: 7060, alimentacao: 950, bemEstar: 0, insalubridade: 324, periculosidade: 0 },
            "ENGENHEIRO CIVIL": { salario: 12903, alimentacao: 800, bemEstar: 0, insalubridade: 0, periculosidade: 0 },
            "ARQUITETO E URBANISTA": { salario: 12903, alimentacao: 800, bemEstar: 0, insalubridade: 0, periculosidade: 0 },
        };

        const ORG_STRUCTURE = {
            "Presidência (PRES)": { units: ["Gabinete da Presidência (GAB)", "Secretaria Executiva e de Articulação (SEAR)", "Unidade de Integridade (UINT)", "Unidade Jurídica (UJUR)", "Unidade de Comunicação (UCOM)", "Unidade de Finanças, Orçamento, Contabilidade e Prestação de Contas (UFOC)", "Unidade de Planejamento e Gestão Estratégica (UPGE)"] },
            "Diretoria de Atenção Integral à Saúde (DAIS)": { units: ["Unidade de Saúde Indígena (USI)", "Unidade de Atenção Primária à Saúde (UAPS)", "Unidade de Atenção Especializada (UAE)", "Unidade de Monitoramento e Avaliação (UMA)", "Unidade de Projetos e Inovação (UPI)", "Unidade de Ensino e Pesquisa (UEP)", "Unidade de Transformação Digital em Saúde (UDIGIS)"] },
            "Diretoria de Operações (DIOP)": { units: ["Unidade de Gestão de Pessoas (UGP)", "Unidade de Aquisições e Contratos (UAC)", "Unidade de Logística, Suprimentos e Patrimônio (ULOG)", "Unidade de Infraestrutura (UINFRA)", "Unidade de Tecnologia da Informação e Comunicação (UTIC)"] }
        };

        const STATUSES = ["Em análise pela UFOC", "Aprovado pela UFOC", "Em análise pela SEAR", "Aprovado pela SEAR", "Aguardando validação da DIREX", "Aprovado pela DIREX"];
        const STATUS_COLORS = { "Em análise pela UFOC": "#f59e0b", "Aprovado pela UFOC": "#10b981", "Em análise pela SEAR": "#3b82f6", "Aprovado pela SEAR": "#6366f1", "Aguardando validação da DIREX": "#f97316", "Aprovado pela DIREX": "#22c55e" };

        const formatCurrency = (val) => new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" }).format(val);

        function calcMonthlyTotal(cargos) {
            return cargos.reduce((sum, c) => {
                if (!c.cargo || !c.quantidade) return sum;
                const data = CARGO_DATA[c.cargo];
                if (!data) return sum;
                const qtd = Number(c.quantidade) || 0;
                return sum + (data.salario + data.alimentacao + data.bemEstar + data.insalubridade + data.periculosidade) * qtd;
            }, 0);
        }

        function calcYearImpact(cargos, requestDate) {
            const now = requestDate ? new Date(requestDate) : new Date();
            const endOfYear = new Date(now.getFullYear(), 11, 31);
            const months = Math.max(1, Math.ceil((endOfYear - now) / (1000 * 60 * 60 * 24 * 30.44)));
            return calcMonthlyTotal(cargos) * months;
        }

        // ── COMPONENTES ─────────────────────────────────────────────────────────

        function ProposalForm({ onSubmit, onCancel }) {
            const [diretoria, setDiretoria] = useState("");
            const [unidade, setUnidade] = useState("");
            const [proposito, setProposito] = useState("");
            const [atribuicoes, setAtribuicoes] = useState([""]);
            const [cargos, setCargos] = useState([{ cargo: "", quantidade: 1 }]);
            const [localizacao, setLocalizacao] = useState("Sede");

            const units = diretoria ? ORG_STRUCTURE[diretoria]?.units || [] : [];
            const monthlyTotal = calcMonthlyTotal(cargos);

            return (
                <div style={{ maxWidth: 860, margin: "0 auto" }}>
                    <div style={styles.pageHeader}>
                        <div style={styles.pageHeaderIcon}>📋</div>
                        <div>
                            <h2 style={styles.pageTitle}>Nova Solicitação de Vagas</h2>
                            <p style={styles.pageSubtitle}>Preencha para análise orçamentária</p>
                        </div>
                    </div>
                    <form onSubmit={(e) => { e.preventDefault(); onSubmit({ diretoria, unidade, proposito, atribuicoes, cargos, localizacao, status: "Em análise pela UFOC", requestDate: new Date().toISOString(), approvals: { UFOC: false, SEAR: false, UTIC: false }, comments: [] }); }}>
                        <div style={styles.card}>
                            <div style={styles.sectionTitle}><span style={styles.sectionDot} />Organização</div>
                            <div style={styles.grid2}>
                                <div style={styles.field}>
                                    <label style={styles.label}>Diretoria</label>
                                    <select style={styles.select} value={diretoria} onChange={(e) => { setDiretoria(e.target.value); setUnidade(""); }} required>
                                        <option value="">Selecione...</option>
                                        {Object.keys(ORG_STRUCTURE).map(d => <option key={d} value={d}>{d}</option>)}
                                    </select>
                                </div>
                                <div style={styles.field}>
                                    <label style={styles.label}>Unidade</label>
                                    <select style={styles.select} value={unidade} onChange={(e) => setUnidade(e.target.value)} required disabled={!diretoria}>
                                        <option value="">Selecione...</option>
                                        {units.map(u => <option key={u} value={u}>{u}</option>)}
                                    </select>
                                </div>
                            </div>
                        </div>

                        <div style={styles.card}>
                            <div style={styles.sectionTitle}><span style={styles.sectionDot} />Composição de Cargos</div>
                            {cargos.map((c, i) => (
                                <div key={i} style={styles.cargoRow}>
                                    <select style={{...styles.select, flex: 3}} value={c.cargo} onChange={(e) => { const n = [...cargos]; n[i].cargo = e.target.value; setCargos(n); }}>
                                        <option value="">Selecionar Cargo...</option>
                                        {Object.keys(CARGO_DATA).map(name => <option key={name} value={name}>{name}</option>)}
                                    </select>
                                    <input type="number" style={{...styles.select, flex: 1}} value={c.quantidade} onChange={(e) => { const n = [...cargos]; n[i].quantidade = e.target.value; setCargos(n); }} />
                                    {cargos.length > 1 && <button type="button" onClick={() => setCargos(cargos.filter((_, idx) => idx !== i))} style={styles.btnDelete}>✕</button>}
                                </div>
                            ))}
                            <button type="button" onClick={() => setCargos([...cargos, { cargo: "", quantidade: 1 }])} style={{...styles.btnSecondary, marginTop: 10}}>+ Adicionar</button>
                            <div style={styles.impactBox}>
                                <div style={styles.impactLabel}>Custo Mensal Estimado</div>
                                <div style={styles.impactValue}>{formatCurrency(monthlyTotal)}</div>
                            </div>
                        </div>
                        <div style={{display: "flex", gap: 10, justifyContent: "flex-end"}}>
                            <button type="button" onClick={onCancel} style={styles.btnOutline}>Cancelar</button>
                            <button type="submit" style={styles.btnPrimary}>Enviar Proposta</button>
                        </div>
                    </form>
                </div>
            );
        }

        function ProposalsList({ proposals, onSelect, onNew }) {
            return (
                <div>
                    <div style={styles.pageHeader}>
                        <div style={styles.pageHeaderIcon}>📊</div>
                        <div style={{flex: 1}}>
                            <h2 style={styles.pageTitle}>Dashboard de Propostas</h2>
                            <p style={styles.pageSubtitle}>{proposals.length} solicitações em andamento</p>
                        </div>
                        <button onClick={onNew} style={styles.btnPrimary}>+ Nova Proposta</button>
                    </div>
                    {proposals.length === 0 ? (
                        <div style={styles.emptyState}>Nenhuma proposta cadastrada ainda.</div>
                    ) : (
                        proposals.map((p, i) => (
                            <div key={i} style={styles.proposalCard} onClick={() => onSelect(p)}>
                                <div style={{display: "flex", justifyContent: "space-between"}}>
                                    <div>
                                        <div style={styles.proposalTitle}>{p.unidade}</div>
                                        <div style={styles.proposalMeta}>{p.diretoria}</div>
                                    </div>
                                    <div style={{textAlign: "right"}}>
                                        <div style={{...styles.statusBadge, background: STATUS_COLORS[p.status]}}>{p.status}</div>
                                        <div style={{marginTop: 5, fontSize: 14, fontWeight: 'bold'}}>{formatCurrency(calcMonthlyTotal(p.cargos))}</div>
                                    </div>
                                </div>
                            </div>
                        ))
                    )}
                </div>
            );
        }

        // ── COMPONENTE PRINCIPAL ────────────────────────────────────────────────
        function App() {
            const [page, setPage] = useState("list");
            const [proposals, setProposals] = useState([]);
            const [selected, setSelected] = useState(null);

            return (
                <div style={styles.root}>
                    <div style={styles.bg} />
                    <nav style={styles.nav}>
                        <div style={styles.navBrand}>
                            <div style={styles.navLogo}>AgSUS</div>
                            <span style={styles.navTitle}>Gestão de Vagas v2.0</span>
                        </div>
                        <button style={styles.navBtn} onClick={() => setPage("list")}>Início</button>
                    </nav>
                    <main style={styles.main}>
                        {page === "list" && <ProposalsList proposals={proposals} onNew={() => setPage("form")} onSelect={(p) => { setSelected(p); setPage("detail"); }} />}
                        {page === "form" && <ProposalForm onCancel={() => setPage("list")} onSubmit={(data) => { setProposals([...proposals, data]); setPage("list"); }} />}
                        {page === "detail" && selected && (
                            <div>
                                <button style={styles.btnOutline} onClick={() => setPage("list")}>← Voltar</button>
                                <div style={{...styles.card, marginTop: 20}}>
                                    <h2>{selected.unidade}</h2>
                                    <p>{selected.proposito}</p>
                                    <div style={{...styles.statusBadge, background: STATUS_COLORS[selected.status]}}>{selected.status}</div>
                                    <hr style={{opacity: 0.1, margin: '20px 0'}} />
                                    <h4>Cargos Solicitados:</h4>
                                    {selected.cargos.map((c, idx) => (
                                        <div key={idx} style={{padding: '5px 0'}}>{c.quantidade}x {c.cargo}</div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        // ── ESTILOS EM JAVASCRIPT ───────────────────────────────────────────────
        const styles = {
            root: { minHeight: "100vh", position: "relative", zIndex: 1 },
            bg: { position: "fixed", inset: 0, background: "radial-gradient(circle at 20% 30%, rgba(99,102,241,0.05), transparent), #0a0e1a", zIndex: -1 },
            nav: { padding: "15px 30px", background: "rgba(13,18,32,0.8)", backdropFilter: "blur(10px)", borderBottom: "1px solid rgba(255,255,255,0.05)", display: "flex", justifyContent: "space-between", alignItems: "center", position: "sticky", top: 0 },
            navBrand: { display: "flex", alignItems: "center", gap: 15 },
            navLogo: { background: "linear-gradient(135deg, #22c55e, #3b82f6)", padding: "5px 12px", borderRadius: "6px", fontWeight: "bold", fontSize: "14px" },
            navTitle: { color: "#94a3b8", fontSize: "13px" },
            navBtn: { background: "none", border: "1px solid rgba(255,255,255,0.1)", color: "#fff", padding: "6px 15px", borderRadius: "6px", cursor: "pointer" },
            main: { maxWidth: "1000px", margin: "0 auto", padding: "40px 20px" },
            pageHeader: { display: "flex", gap: 20, alignItems: "center", marginBottom: "30px" },
            pageHeaderIcon: { fontSize: "32px" },
            pageTitle: { margin: 0, fontSize: "24px" },
            pageSubtitle: { margin: 0, color: "#64748b" },
            card: { background: "rgba(255,255,255,0.03)", border: "1px solid rgba(255,255,255,0.08)", borderRadius: "12px", padding: "24px", marginBottom: "20px" },
            sectionTitle: { display: "flex", alignItems: "center", gap: 10, fontSize: "14px", fontWeight: "bold", color: "#a5b4fc", marginBottom: "20px" },
            sectionDot: { width: "8px", height: "8px", background: "#6366f1", borderRadius: "50%" },
            grid2: { display: "grid", gridTemplateColumns: "1fr 1fr", gap: "20px" },
            field: { display: "flex", flexDirection: "column", gap: "8px" },
            label: { fontSize: "12px", color: "#94a3b8", textTransform: "uppercase" },
            select: { background: "rgba(0,0,0,0.2)", border: "1px solid rgba(255,255,255,0.1)", padding: "10px", borderRadius: "8px", color: "#fff", outline: "none" },
            cargoRow: { display: "flex", gap: "10px", marginBottom: "10px" },
            btnPrimary: { background: "#4f46e5", color: "#fff", border: "none", padding: "12px 24px", borderRadius: "8px", fontWeight: "bold", cursor: "pointer" },
            btnSecondary: { background: "rgba(99,102,241,0.1)", border: "1px solid #6366f1", color: "#a5b4fc", padding: "8px 16px", borderRadius: "8px", cursor: "pointer" },
            btnOutline: { background: "none", border: "1px solid rgba(255,255,255,0.2)", color: "#94a3b8", padding: "10px 20px", borderRadius: "8px", cursor: "pointer" },
            btnDelete: { background: "rgba(239,68,68,0.1)", border: "none", color: "#ef4444", padding: "10px", borderRadius: "8px", cursor: "pointer" },
            impactBox: { marginTop: "20px", padding: "15px", background: "rgba(99,102,241,0.05)", borderRadius: "8px", borderLeft: "4px solid #6366f1" },
            impactLabel: { fontSize: "11px", color: "#94a3b8", textTransform: "uppercase" },
            impactValue: { fontSize: "20px", fontWeight: "bold", marginTop: "5px" },
            proposalCard: { background: "rgba(255,255,255,0.02)", border: "1px solid rgba(255,255,255,0.05)", padding: "20px", borderRadius: "12px", marginBottom: "12px", cursor: "pointer" },
            proposalTitle: { fontSize: "16px", fontWeight: "bold" },
            proposalMeta: { fontSize: "13px", color: "#64748b", marginTop: "4px" },
            statusBadge: { display: "inline-block", padding: "4px 10px", borderRadius: "20px", fontSize: "11px", fontWeight: "bold", color: "#fff" },
            emptyState: { textAlign: "center", padding: "50px", color: "#64748b", border: "2px dashed rgba(255,255,255,0.05)", borderRadius: "12px" }
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
